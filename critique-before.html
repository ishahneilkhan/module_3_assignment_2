<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Profile — v0.1 (before critique)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #F6F7F9; display:flex; justify-content:center; }
  .screen { width: 390px; min-height: 100vh; background:#fff; }
  .hero {
    height: 260px;
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom: 24px;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: rgba(255,255,255,0.3); border: 3px solid #fff;
  }
  .content { padding: 24px; text-align:center; }
  .name { font-size: 20px; font-weight:700; color:#111; }
  .badge {
    display:inline-flex; align-items:center; gap:4px;
    margin-top: 8px; font-size: 12px; color:#22c55e;
  }
  .rating { margin-top: 8px; font-size: 14px; color:#f59e0b; }
  .price { margin-top: 12px; font-size: 12px; color: #9ca3af; }
  .bio { margin-top: 16px; font-size: 14px; color:#4b5563; line-height:1.5; }
  .cta {
    margin-top: 32px; width: 100%; padding: 14px;
    background: linear-gradient(90deg, #a78bfa, #ec4899);
    color:#fff; border:none; border-radius: 24px; font-size: 16px; font-weight:600;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="hero"><div class="avatar"></div></div>
  <div class="content">
    <div class="name">Rahat Hossain</div>
    <div class="badge">✓ Verified</div>
    <div class="rating">★★★★★ 4.8</div>
    <div class="price">৳500/hr</div>
    <div class="bio">Experienced math tutor with 5+ years teaching HSC students. Passionate about helping students achieve their goals.</div>
    <button class="cta">Book Now</button>
  </div>
</div>
</body>
</html>
